[package]
name = "whatsapp-web-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
whatsapp-rust = { git = "https://github.com/jlucaso1/whatsapp-rust.git", default-features = false, features = ["sqlite-storage", "tokio-transport", "ureq-client", "tokio-native"] }
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
