[package]
name = "whatsapp-web-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "multipart", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.5", features = ["limit", "timeout"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
tokio = { version = "1", features = ["full"] }

# Database
# NOTE: We avoid enabling `migrate`, `chrono`, `uuid`, `json` directly on `sqlx`
# because sqlx's feature definitions reference `sqlx-sqlite?/...` which triggers
# a Cargo resolver bug when `whatsapp-rust-sqlite-storage` (via diesel) brings in
# a conflicting `libsqlite3-sys` version. Instead we enable these features on the
# subcrates directly.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros"] }
sqlx-core = { version = "0.8", default-features = false, features = ["migrate", "chrono", "uuid", "json"] }
sqlx-postgres = { version = "0.8", default-features = false, features = ["migrate", "chrono", "uuid", "json"] }


# WhatsApp client library
whatsapp-rust = { version = "0.5", default-features = false, features = [
    "tokio-runtime", "tokio-native", "tokio-transport",
    "ureq-client", "sqlite-storage", "moka-cache", "signal"
] }
whatsapp-rust-tokio-transport = "0.5"
whatsapp-rust-ureq-http-client = "0.5"
wacore = { version = "0.5", default-features = false }
wacore-binary = { version = "0.5", default-features = false }
waproto = "0.5"

# Auth & crypto
jsonwebtoken = "9"
argon2 = "0.5"
sha2 = "0.10"
hex = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
rand = "0.9"
base64 = "0.22"
futures-util = "0.3"
async-channel = "2"
log = "0.4"
